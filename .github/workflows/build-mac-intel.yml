name: Build Mac Intel

on:
  workflow_dispatch:

jobs:
  build-mac-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Build (universal2)
        run: |
          python -m PyInstaller --onefile --windowed --name "GPU-Intel" \
            --target-architecture x86_64 --clean gpu_app.py || \
          python -m PyInstaller --onefile --windowed --name "GPU-Intel" --clean gpu_app.py
      
      - name: Create DMG
        run: |
          mkdir -p dmg-content
          cp -r dist/GPU-Intel.app dmg-content/GPU.app
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "GPU" -srcfolder dmg-content -ov -format UDZO dist/GPU-Intel.dmg
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GPU-Mac-Intel
          path: dist/GPU-Intel.dmg
