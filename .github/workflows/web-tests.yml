name: Web tests

on:
  push:
    paths: ['web/**', '.github/workflows/web-tests.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-tests.yml']
  workflow_dispatch:

jobs:
  search-centering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/search-centering
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
